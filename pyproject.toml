[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frequency-vla"
version = "0.1.0"
description = "Evaluation-only, paired replanning experiments using official OpenPI LIBERO"
requires-python = ">=3.8"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
analysis = ["numpy>=1.22.4,<2", "matplotlib>=3.5.3"]
test = ["pytest>=8.3,<8.4"]

[project.scripts]
frequency-vla = "frequency_vla.evaluator:main"
frequency-vla-aggregate = "frequency_vla.analysis:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
